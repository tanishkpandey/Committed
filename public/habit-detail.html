<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Habit Details - Committed</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="stylesheet" href="css/main.css?v=1788628200">
  <link rel="stylesheet" href="css/components.css?v=1788628200">
  <link rel="stylesheet" href="css/animations.css?v=1788628200">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <div class="app-container">
    <!-- Top Header Bar with Edit & Delete Actions -->
    <header class="header-bar">
      <a href="/" class="btn btn-secondary">
        <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
        <span>Back</span>
      </a>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <button class="btn btn-secondary" onclick="openEditModal()">
          <i data-lucide="edit-3" style="width: 15px; height: 15px;"></i>
        </button>
        <button class="btn btn-secondary" onclick="deleteCurrentHabit()" style="color: var(--accent-rose);">
          <i data-lucide="trash-2" style="width: 15px; height: 15px;"></i>
        </button>
      </div>
    </header>

    <main id="detailContainer">
      <!-- Habit Card Header & Metrics -->
      <div class="habit-card" style="margin-bottom: 1.15rem;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.15rem;">
          <div style="display: flex; align-items: center; gap: 0.85rem; min-width: 0; flex: 1;">
            <div class="habit-icon-badge" id="habitDetailBadge"
              style="width: 46px; height: 46px; border-radius: var(--radius-sm);">
              <i data-lucide="zap"></i>
            </div>
            <div style="min-width: 0; flex: 1;">
              <h1 id="habitDetailTitle"
                style="font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                <span class="skeleton-shimmer" style="width: 140px; height: 1.25rem; display: inline-block;"></span>
              </h1>
              <p id="habitDetailDesc"
                style="color: var(--text-muted); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                <span class="skeleton-shimmer" style="width: 90px; height: 12px; display: inline-block;"></span>
              </p>
            </div>
          </div>
        </div>

        <!-- 3-Column Metrics -->
        <div class="detail-metrics-grid"
          style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; text-align: center; background: var(--bg-card); border: 1px solid var(--border-subtle); padding: 0.85rem 0.5rem; border-radius: var(--radius-md, 16px); margin-bottom: 1.15rem; box-shadow: var(--shadow-card);">
          <div>
            <div class="stat-tile-label" style="text-align: center; margin-bottom: 0.25rem;">Current streak</div>
            <div id="statCurrentStreak" class="stat-tile-val"
              style="font-size: 1.35rem; color: #f59e0b;"><span class="skeleton-shimmer"
                style="width: 35px; height: 1.2rem; display: inline-block;"></span></div>
          </div>
          <div>
            <div class="stat-tile-label" style="text-align: center; margin-bottom: 0.25rem;">Best streak</div>
            <div id="statLongestStreak" class="stat-tile-val"
              style="font-size: 1.35rem; color: #10b981;"><span class="skeleton-shimmer"
                style="width: 35px; height: 1.2rem; display: inline-block;"></span></div>
          </div>
          <div>
            <div class="stat-tile-label" style="text-align: center; margin-bottom: 0.25rem;">Total logs</div>
            <div id="statTotalCompletions" class="stat-tile-val"
              style="font-size: 1.35rem; color: var(--text-primary);"><span class="skeleton-shimmer"
                style="width: 35px; height: 1.2rem; display: inline-block;"></span></div>
          </div>
        </div>

        <!-- Sleek Segmented View Switcher -->
        <div class="detail-view-switcher">
          <button class="detail-view-btn active" id="btnViewYear" onclick="setViewMode('year')">
            <i data-lucide="grid" style="width: 15px; height: 15px;"></i>
            <span>Year</span>
          </button>
          <button class="detail-view-btn" id="btnViewMonth" onclick="setViewMode('month')">
            <i data-lucide="calendar" style="width: 15px; height: 15px;"></i>
            <span>Months</span>
          </button>
        </div>

        <!-- 1. Full Current Year Grid View -->
        <div id="yearGridWrapper">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.55rem;">
            <span style="font-size: 0.78rem; font-weight: 750; color: var(--text-primary);" id="yearGridTitle">2026
              Calendar Grid</span>
            <span style="font-size: 0.72rem; color: var(--text-muted);" id="yearGridStatsLabel">Jan 1 – Dec 31</span>
          </div>
          <div class="grid-wrapper">
            <div class="contribution-grid" id="yearGridContainer">
              <!-- Rendered via habitDetail.js -->
            </div>
          </div>
        </div>

        <!-- 2. Months Breakdown View -->
        <div id="monthBreakdownWrapper" style="display: none;">
          <div class="months-breakdown-grid" id="monthBreakdownGrid">
            <!-- Rendered via habitDetail.js -->
          </div>
        </div>
      </div>

      <!-- Weekday Distribution Throughout the Year Section -->
      <div class="habit-card" id="weekdayDistributionCard">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.25rem;">
          <div style="display: flex; align-items: center; gap: 0.45rem;">
            <i data-lucide="bar-chart-2" style="width: 16px; height: 16px; color: var(--accent-emerald, #10b981);"></i>
            <h3 style="font-size: 0.92rem; font-weight: 750;">Weekday Activity</h3>
          </div>
          <span class="detail-year-badge" id="weekdayChartYearBadge">2026</span>
        </div>
        <p style="font-size: 0.72rem; color: var(--text-muted); margin-bottom: 0.85rem;">Total check-ins logged on each day of the week</p>

        <div class="weekday-bars-container" id="weekdayChartContainer">
          <!-- Rendered via habitDetail.js -->
        </div>

        <div class="weekday-insights-row" id="weekdayInsightsRow">
          <!-- Rendered via habitDetail.js -->
        </div>
      </div>

      <!-- Top 3 Streak History Section -->
      <div class="habit-card">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
          <div style="display: flex; align-items: center; gap: 0.4rem;">
            <i data-lucide="flame" style="width: 16px; height: 16px; color: #f59e0b;"></i>
            <h3 style="font-size: 0.92rem; font-weight: 750;">Top 3 Streak History</h3>
          </div>
          <span style="font-size: 0.72rem; color: var(--text-muted);">All-time records</span>
        </div>
        <div class="streak-history-list" id="streakHistoryList">
          <!-- Rendered via habitDetail.js -->
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Habit Modal -->
  <div class="modal-overlay" id="editHabitModalOverlay">
    <div class="modal-box">
      <div class="sheet-drag-handle"></div>
      <div class="modal-header">
        <h3 class="modal-title">Edit Habit</h3>
        <button class="close-btn" onclick="closeEditModal()">
          <i data-lucide="x" style="width: 22px; height: 22px;"></i>
        </button>
      </div>

      <form onsubmit="saveHabitEdits(event)">
        <div class="form-group">
          <label class="form-label">Habit Name *</label>
          <input type="text" class="form-input" id="editHabitTitle" required>
        </div>

        <div class="form-group">
          <label class="form-label">Goal / Note (Optional)</label>
          <input type="text" class="form-input" id="editHabitDesc" placeholder="e.g. 15 mins daily">
        </div>

        <div class="form-row-2col">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select class="form-select" id="editHabitCategory">
              <!-- Dynamically populated -->
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Target Frequency</label>
            <select class="form-select" id="editHabitFrequency">
              <option value="7">7x / Week (Daily)</option>
              <option value="6">6x / Week</option>
              <option value="5">5x / Week</option>
              <option value="4">4x / Week</option>
              <option value="3">3x / Week (Gym)</option>
              <option value="2">2x / Week</option>
              <option value="1">1x / Week</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Grid Timeframe</label>
          <select class="form-select" id="editHabitGridDays">
            <option value="30">30 Days</option>
            <option value="60">60 Days</option>
            <option value="90">90 Days</option>
            <option value="180">180 Days</option>
            <option value="365">365 Days</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Color Theme</label>
          <div class="palette-grid" id="editPaletteGrid"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Icon</label>
          <div class="icon-picker-grid" id="editIconPickerGrid"></div>
        </div>

        <div style="display: flex; gap: 0.65rem; margin-top: 1.25rem;">
          <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex: 2;">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Month & Year Selector Modal -->
  <div class="modal-overlay" id="monthPickerModalOverlay" onclick="if(event.target === this) closeMonthPickerModal()">
    <div class="modal-box" style="max-width: 360px;">
      <div class="sheet-drag-handle"></div>
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <button class="month-card-nav-arrow" onclick="changePickerYear(-1)" title="Previous Year" aria-label="Previous Year">
            <i data-lucide="chevron-left" style="width: 15px; height: 15px;"></i>
          </button>
          <span id="pickerYearTitle" style="font-size: 1.05rem; font-weight: 800; color: var(--text-primary);">2026</span>
          <button class="month-card-nav-arrow" onclick="changePickerYear(1)" title="Next Year" aria-label="Next Year">
            <i data-lucide="chevron-right" style="width: 15px; height: 15px;"></i>
          </button>
        </div>
        <button class="close-btn" onclick="closeMonthPickerModal()" aria-label="Close modal">
          <i data-lucide="x" style="width: 20px; height: 20px;"></i>
        </button>
      </div>

      <div class="month-picker-grid" id="monthPickerGrid">
        <!-- Rendered via habitDetail.js -->
      </div>
    </div>
  </div>

    <nav class="bottom-nav">
