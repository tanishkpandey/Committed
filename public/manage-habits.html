<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">\n  <title>Habit Studio - Committed</title>
  <link rel="stylesheet" href="css/main.css?v=1787946236">
  <link rel="stylesheet" href="css/components.css?v=1787946236">
  <link rel="stylesheet" href="css/animations.css?v=1787946236">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <header class="header-bar">
      <div>
        <h1 class="app-title">Habit Studio</h1>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Manage, create and customize your habit cards</p>
      </div>
      <button class="btn btn-primary" onclick="openHabitModal()">
        <i data-lucide="plus"></i>
        <span>New Habit</span>
      </button>
    </header>

    <div id="studioList" style="display: flex; flex-direction: column; gap: 0.85rem;">
      <!-- Loaded dynamically -->
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal-overlay" id="habitModalOverlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Edit Habit</h3>
        <button class="close-btn" onclick="closeHabitModal()">
          <i data-lucide="x" style="width: 22px; height: 22px;"></i>
        </button>
      </div>

      <form onsubmit="saveHabitForm(event)">
        <div class="form-group">
          <label class="form-label">Habit Name *</label>
          <input type="text" class="form-input" id="habitTitleInput" required oninput="updateLivePreview()">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <input type="text" class="form-input" id="habitDescInput" oninput="updateLivePreview()">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select class="form-select" id="habitCategorySelect">
              <option value="General">General</option>
              <option value="Fitness">Fitness</option>
              <option value="Mindfulness">Mindfulness</option>
              <option value="Health">Health</option>
              <option value="Learning">Learning</option>
              <option value="Productivity">Productivity</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Grid Timeframe</label>
            <select class="form-select" id="habitGridDaysSelect">
              <option value="30">30 Days</option>
              <option value="60" selected>60 Days</option>
              <option value="90">90 Days</option>
              <option value="180">180 Days</option>
              <option value="365">365 Days</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Color Theme</label>
          <div class="palette-grid" id="paletteGrid"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Icon</label>
          <div class="icon-picker-grid" id="iconPickerGrid"></div>
        </div>

        <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
          <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeHabitModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex: 2;">Save Habit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bottom Nav -->
    <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="/" class="nav-item">
      <i data-lucide="grid"></i>
      <span>Habits</span>
    </a>
    <a href="/progress.html" class="nav-item">
      <i data-lucide="award"></i>
      <span>Progress</span>
    </a>
    <a href="/manage-habits.html" class="nav-item active">
      <i data-lucide="list-plus"></i>
      <span>Studio</span>
    </a>
    <a href="/analytics.html" class="nav-item">
      <i data-lucide="bar-chart-3"></i>
      <span>Insights</span>
    </a>
    <a href="/settings.html" class="nav-item">
      <i data-lucide="settings"></i>
      <span>Settings</span>
    </a>
  </nav>

  <script src="js/api.js?v=1787946236"></script>
  <script src="js/utils.js?v=1787946236"></script>
  <script src="js/habitStudio.js?v=1787946236"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const saved = localStorage.getItem('committed_theme' || localStorage.getItem('habitkit_theme')) || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      
      const res = await API.getHabits();
      const list = document.getElementById('studioList');
      if (res.success && res.habits) {
        list.innerHTML = res.habits.map(h => `
          <div class="habit-card" style="margin-bottom: 0; display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 0.85rem;">
              <div class="habit-icon-badge" style="background-color: ${h.color};">
                <i data-lucide="${h.icon || 'zap'}"></i>
              </div>
              <div>
                <h4 style="font-weight: 700;">${h.title}</h4>
                <span style="font-size: 0.75rem; color: var(--text-muted);">${h.category} • ${h.grid_days || 60} days grid</span>
              </div>
            </div>
            <div style="display: flex; gap: 0.5rem;">
              <button class="btn btn-secondary" onclick='openHabitModal(${JSON.stringify(h)})' style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">
                <i data-lucide="edit-2" style="width: 14px; height: 14px;"></i> Edit
              </button>
            </div>
          </div>
        `).join('');
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
