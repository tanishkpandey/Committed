<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Habit Studio - Committed</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="stylesheet" href="css/main.css?v=1787955555">
  <link rel="stylesheet" href="css/components.css?v=1787955555">
  <link rel="stylesheet" href="css/animations.css?v=1787955555">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-container">
    <header class="header-bar">
      <div>
        <h1 class="app-title">Habit Studio</h1>
        <p style="font-size: 0.8rem; color: var(--text-muted);">Manage, create and customize your habit cards</p>
      </div>
      <button class="btn btn-primary" onclick="openHabitModal()">
        <i data-lucide="plus"></i>
        <span>New Habit</span>
      </button>
    </header>

    <div id="studioList" style="display: flex; flex-direction: column; gap: 0.85rem;">
      <div class="habit-card" style="margin-bottom: 0; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 0.85rem;">
          <div class="skeleton-shimmer skeleton-circle" style="width: 36px; height: 36px;"></div>
          <div>
            <div class="skeleton-shimmer" style="width: 120px; height: 14px; margin-bottom: 5px;"></div>
            <div class="skeleton-shimmer" style="width: 80px; height: 10px;"></div>
          </div>
        </div>
        <div class="skeleton-shimmer skeleton-pill" style="width: 60px; height: 28px;"></div>
      </div>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal-overlay" id="habitModalOverlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Edit Habit</h3>
        <button class="close-btn" onclick="closeHabitModal()">
          <i data-lucide="x" style="width: 22px; height: 22px;"></i>
        </button>
      </div>

      <form onsubmit="saveHabitForm(event)">
        <div class="form-group">
          <label class="form-label">Habit Name *</label>
          <input type="text" class="form-input" id="habitTitleInput" required>
        </div>
        <div class="form-group">
          <label class="form-label">Description / Note</label>
          <input type="text" class="form-input" id="habitDescInput" placeholder="e.g. 15 mins daily">
        </div>
        <div class="form-row-2col">
          <div class="form-group">
            <label class="form-label">Category</label>
            <select class="form-select" id="habitCategorySelect">
              <option value="General">General</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Target Frequency</label>
            <select class="form-select" id="habitFrequencySelect">
              <option value="7" selected>7x / Week (Daily)</option>
              <option value="6">6x / Week</option>
              <option value="5">5x / Week (Weekdays)</option>
              <option value="4">4x / Week</option>
              <option value="3">3x / Week</option>
              <option value="2">2x / Week</option>
              <option value="1">1x / Week</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Grid Timeframe</label>
          <select class="form-select" id="habitGridDaysSelect">
            <option value="30">30 Days</option>
            <option value="60">60 Days</option>
            <option value="90">90 Days</option>
            <option value="180">180 Days</option>
            <option value="365" selected>365 Days (Full Year)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Color Theme</label>
          <div class="palette-grid" id="paletteGrid"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Icon</label>
          <div class="icon-picker-grid" id="iconPickerGrid"></div>
        </div>

        <div style="display: flex; gap: 0.65rem; margin-top: 1.25rem;">
          <button type="button" class="btn btn-secondary" id="modalDeleteBtn" onclick="handleModalDeleteClick()" style="display: none; color: var(--accent-rose); border-color: rgba(244, 63, 94, 0.3);">
            <i data-lucide="trash-2" style="width: 15px; height: 15px;"></i>
            <span>Delete</span>
          </button>
          <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeHabitModal()">Cancel</button>
          <button type="submit" class="btn btn-primary" style="flex: 2;">Save Habit</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="/" class="nav-item">
      <i data-lucide="grid"></i>
      <span>Habits</span>
    </a>
    <a href="/progress.html" class="nav-item">
      <i data-lucide="award"></i>
      <span>Progress</span>
    </a>
    <a href="/manage-habits.html" class="nav-item active">
      <i data-lucide="list-plus"></i>
      <span>Studio</span>
    </a>
    <a href="/analytics.html" class="nav-item">
      <i data-lucide="bar-chart-3"></i>
      <span>Insights</span>
    </a>
    <a href="/settings.html" class="nav-item">
      <i data-lucide="settings"></i>
      <span>Settings</span>
    </a>
  </nav>

  <script src="js/api.js?v=1787946236"></script>
  <script src="js/utils.js?v=1787946236"></script>
  <script src="js/habitStudio.js?v=1787946236"></script>
  <script>
    async function loadStudioHabits() {
      const list = document.getElementById('studioList');
      try {
        const res = await API.getHabits();
        if (res.success && res.habits) {
          if (res.habits.length === 0) {
            list.innerHTML = `
              <div style="text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
                <i data-lucide="sparkles" style="width: 36px; height: 36px; margin: 0 auto 0.5rem; opacity: 0.5;"></i>
                <p>No habits yet. Click "New Habit" to create one.</p>
              </div>
            `;
            lucide.createIcons();
            return;
          }

          list.innerHTML = res.habits.map(h => {
            const hJson = JSON.stringify(h).replace(/'/g, "&apos;").replace(/"/g, '&quot;');
            return `
              <div class="habit-card" style="margin-bottom: 0; display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 0.85rem; min-width: 0; flex: 1;">
                  <div class="habit-icon-badge" style="background-color: ${h.color};">
                    <i data-lucide="${h.icon || 'zap'}"></i>
                  </div>
                  <div style="min-width: 0; flex: 1;">
                    <h4 style="font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${escapeHtml(h.title)}</h4>
                    <span style="font-size: 0.75rem; color: var(--text-muted);">${escapeHtml(h.category || 'General')} • ${h.grid_days || 60}d grid • ${h.totalCompletions || 0} logs</span>
                  </div>
                </div>
                <div style="display: flex; gap: 0.4rem; align-items: center;">
                  <button class="btn btn-secondary" onclick='openHabitModal(${hJson})' style="min-height: 44px; padding: 0.45rem 0.75rem; font-size: 0.8rem;" title="Edit Habit">
                    <i data-lucide="edit-2" style="width: 14px; height: 14px;"></i> Edit
                  </button>
                  <button class="btn btn-secondary" onclick='deleteStudioHabit("${h.id}", "${escapeHtml(h.title)}")' style="min-height: 44px; min-width: 44px; padding: 0.45rem 0.65rem; font-size: 0.8rem; color: var(--accent-rose);" title="Delete Habit">
                    <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
                  </button>
                </div>
              </div>
            `;
          }).join('');
          lucide.createIcons();
        }
      } catch (e) {
        list.innerHTML = '<div style="color: var(--accent-rose); text-align: center; padding: 2rem;">Failed to load habits.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('committed_theme' || localStorage.getItem('habitkit_theme')) || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      loadStudioHabits();
    });
  </script>
</body>
</html>
