<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10" id="themeColorMeta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <title>Progress - Committed</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="dns-prefetch" href="https://unpkg.com">
  <link rel="stylesheet" href="css/main.css?v=1788627500">
  <link rel="stylesheet" href="css/components.css?v=1788632000">
  <link rel="stylesheet" href="css/animations.css?v=1788627500">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <!-- Shared Achievement Badge SVG Definitions -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <defs>
      <!-- Hexagon Base Path -->
      <path id="badge-hex"
        d="M 38,0 L 92,0 Q 98,0 101,6 L 124,49 Q 127,55 124,61 L 101,104 Q 98,110 92,110 L 38,110 Q 32,110 29,104 L 6,61 Q 3,55 6,49 L 29,6 Q 32,0 38,0 Z" />

      <clipPath id="badge-hexClip">
        <use href="#badge-hex" />
      </clipPath>

      <!-- Star Icon -->
      <g id="badge-star">
        <path d="M0,-7 L2,-2 L7,-2 L3,1 L5,6 L0,3 L-5,6 L-3,1 L-7,-2 L-2,-2 Z" fill="#FFFFFF" />
      </g>

      <!-- Shadow Filters -->
      <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <filter id="ribbonShadow" x="-30%" y="-30%" width="160%" height="170%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.30" />
      </filter>

      <!-- Category Gradients: STREAKS (Violet) -->
      <linearGradient id="streakTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#40318F" />
        <stop offset="100%" stop-color="#6752D6" />
      </linearGradient>
      <linearGradient id="streakBottom" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#806BE7" />
        <stop offset="100%" stop-color="#342779" />
      </linearGradient>

      <!-- Category Gradients: PERFECT DAYS (Gold) -->
      <linearGradient id="perfectTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#C78312" />
        <stop offset="100%" stop-color="#F3B52E" />
      </linearGradient>
      <linearGradient id="perfectBottom" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FFD66B" />
        <stop offset="100%" stop-color="#D99217" />
      </linearGradient>

      <!-- Category Gradients: CONSISTENCY (Emerald) -->
      <linearGradient id="consistencyTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#176A61" />
        <stop offset="100%" stop-color="#2D9A89" />
      </linearGradient>
      <linearGradient id="consistencyBottom" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#55C7B0" />
        <stop offset="100%" stop-color="#1C7065" />
      </linearGradient>

      <!-- Category Gradients: VOLUME (Ocean Blue) -->
      <linearGradient id="volumeTop" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#164B78" />
        <stop offset="100%" stop-color="#247DB5" />
      </linearGradient>
      <linearGradient id="volumeBottom" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5DB8E8" />
        <stop offset="100%" stop-color="#1C5D89" />
      </linearGradient>
    </defs>
  </svg>

  <div class="app-container">
    <!-- Header Top Bar -->
    <header class="header-bar">
      <a href="/" class="logo-group">
        <span class="app-title">Committed</span>
      </a>
    </header>

    <!-- 1. LEVEL CARD -->
    <section class="progress-section" style="margin-bottom: 0.85rem;">
      <div class="progress-level-card">
        <div class="level-card-top">
          <div class="level-card-badge-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
            </svg>
          </div>
          <div class="level-card-info">
            <span class="level-card-label" id="levelCardLabel"><span class="skeleton-shimmer" style="width: 48px; height: 11px; border-radius: 3px; display: inline-block;"></span></span>
            <h2 class="level-card-headline" id="levelCardHeadline">
              <span class="skeleton-shimmer" style="width: 140px; height: 24px; border-radius: var(--radius-xs); display: inline-block;"></span>
            </h2>
          </div>
        </div>

        <div class="level-progress-track">
          <div class="level-progress-fill" id="levelProgressFill" style="width: 0%;"></div>
        </div>

        <div class="level-xp-footer">
          <span id="levelXpCurrent"><span class="skeleton-shimmer" style="width: 45px; height: 13px; border-radius: 4px; display: inline-block;"></span></span>
          <span id="levelXpNext"><span class="skeleton-shimmer" style="width: 55px; height: 13px; border-radius: 4px; display: inline-block;"></span></span>
        </div>
      </div>
    </section>

    <!-- 2. BEST STREAK CARD (Directly under level card, gold tint) -->
    <section class="progress-section" style="margin-bottom: 1.15rem;">
      <div class="best-streak-card">
        <div class="best-streak-label">Your best streak ever</div>
        <div class="best-streak-val-row">
          <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"
            class="best-streak-icon">
            <path
              d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z" />
          </svg>
          <span class="best-streak-number" id="bestStreakDays">
            <span class="skeleton-shimmer" style="width: 65px; height: 24px; border-radius: var(--radius-xs); display: inline-block;"></span>
          </span>
        </div>
      </div>
    </section>

    <!-- 3. STATS GRID (2 columns, 2 rows) -->
    <section class="progress-section" style="margin-bottom: 1.25rem;">
      <div class="progress-stats-grid">
        <!-- Total XP -->
        <div class="progress-stat-card">
          <div class="progress-stat-label">Total XP</div>
          <div class="progress-stat-val" id="statTotalXp">
            <span class="skeleton-shimmer" style="width: 55px; height: 20px; border-radius: var(--radius-xs); display: inline-block;"></span>
          </div>
        </div>

        <!-- Check ins -->
        <div class="progress-stat-card">
          <div class="progress-stat-label">Check ins</div>
          <div class="progress-stat-val" id="statCheckIns">
            <span class="skeleton-shimmer" style="width: 40px; height: 20px; border-radius: var(--radius-xs); display: inline-block;"></span>
          </div>
        </div>

        <!-- Perfect days -->
        <div class="progress-stat-card" id="statCardPerfectDays">
          <div class="progress-stat-label">Perfect days</div>
          <div class="progress-stat-val" id="statPerfectDays">
            <span class="skeleton-shimmer" style="width: 35px; height: 20px; border-radius: var(--radius-xs); display: inline-block;"></span>
          </div>
        </div>

        <!-- Badges -->
        <div class="progress-stat-card">
          <div class="progress-stat-label">Badges</div>
          <div class="progress-stat-val" id="statBadgesCount">
            <span class="skeleton-shimmer" style="width: 55px; height: 20px; border-radius: var(--radius-xs); display: inline-block;"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- 4. NEXT BADGE SECTION (Single card with circular progress ring SVG) -->
    <section class="progress-section" id="nextBadgeSection" style="margin-bottom: 1.25rem;">
      <div class="progress-section-heading">Next badge to unlock</div>
      <div class="next-badge-card" id="nextBadgeCard">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; width: 100%;">
          <div style="display: flex; align-items: center; gap: 0.85rem; flex: 1;">
            <div class="skeleton-shimmer skeleton-circle" style="width: 48px; height: 48px; flex-shrink: 0;"></div>
            <div style="display: flex; flex-direction: column; gap: 6px; flex: 1;">
              <div class="skeleton-shimmer" style="width: 120px; height: 16px; border-radius: var(--radius-xs);"></div>
              <div class="skeleton-shimmer" style="width: 160px; height: 12px; border-radius: var(--radius-xs);"></div>
            </div>
          </div>
          <div class="skeleton-shimmer skeleton-circle" style="width: 44px; height: 44px; flex-shrink: 0;"></div>
        </div>
      </div>
    </section>

    <!-- 5. YOUR BADGES SECTION (Heading left, "See all (24) →" right, 4-column row) -->
    <section class="progress-section" style="margin-bottom: 1.5rem;">
      <div class="progress-badges-header">
        <div class="progress-section-heading" style="margin-bottom: 0;">Your badges</div>
        <button class="progress-see-all-btn" id="progressSeeAllBtn" onclick="openAllBadgesModal()"
          aria-label="See all badges">See all (24) →</button>
      </div>
      <div class="your-badges-row" id="yourBadgesRow">
        <div class="badge-item-card" style="pointer-events: none;"><div class="skeleton-shimmer skeleton-circle" style="width: 40px; height: 40px; margin: 0 auto 0.4rem;"></div><div class="skeleton-shimmer" style="width: 48px; height: 10px; margin: 0 auto; border-radius: 3px;"></div></div>
        <div class="badge-item-card" style="pointer-events: none;"><div class="skeleton-shimmer skeleton-circle" style="width: 40px; height: 40px; margin: 0 auto 0.4rem;"></div><div class="skeleton-shimmer" style="width: 52px; height: 10px; margin: 0 auto; border-radius: 3px;"></div></div>
        <div class="badge-item-card" style="pointer-events: none;"><div class="skeleton-shimmer skeleton-circle" style="width: 40px; height: 40px; margin: 0 auto 0.4rem;"></div><div class="skeleton-shimmer" style="width: 44px; height: 10px; margin: 0 auto; border-radius: 3px;"></div></div>
        <div class="badge-item-card" style="pointer-events: none;"><div class="skeleton-shimmer skeleton-circle" style="width: 40px; height: 40px; margin: 0 auto 0.4rem;"></div><div class="skeleton-shimmer" style="width: 50px; height: 10px; margin: 0 auto; border-radius: 3px;"></div></div>
      </div>
    </section>
  </div>

  <!-- All Badges Modal (Bottom Sheet) -->
  <div class="modal-overlay" id="allBadgesModalOverlay" onclick="if(event.target === this) closeAllBadgesModal()">
    <div class="modal-box all-badges-modal">
      <div class="sheet-drag-handle"></div>
      <div class="modal-header">
        <div>
          <h3 class="modal-title" style="font-size: 1.1rem; font-weight: 850; margin-bottom: 0.15rem;">All badges</h3>
          <p class="modal-subtitle" id="modalBadgesSubtitle">0 of 24 unlocked</p>
        </div>
        <button class="close-btn" onclick="closeAllBadgesModal()" aria-label="Close modal">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Filter chips: All, Streaks, Perfect days, Consistency, Total logs -->
      <div class="modal-filter-scroll" role="tablist" aria-label="Badge categories">
        <button class="modal-filter-chip active" onclick="setModalCategoryFilter('all', this)">All</button>
        <button class="modal-filter-chip" onclick="setModalCategoryFilter('streak', this)">Streaks</button>
        <button class="modal-filter-chip" onclick="setModalCategoryFilter('perfect_days', this)">Perfect days</button>
        <button class="modal-filter-chip" onclick="setModalCategoryFilter('consistency', this)">Consistency</button>
        <button class="modal-filter-chip" onclick="setModalCategoryFilter('volume', this)">Total logs</button>
      </div>

      <!-- Full Badges List Grid in Modal (Grouped by Category) -->
      <div class="modal-badges-container" id="modalBadgesContainer">
        <!-- Rendered dynamically via progress.js -->
      </div>
    </div>
  </div>

  <!-- 5-Tab Bottom Navigation -->
  <nav class="bottom-nav">
    <a href="/habits.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="7" height="7" x="3" y="3" rx="1" />
        <rect width="7" height="7" x="14" y="3" rx="1" />
        <rect width="7" height="7" x="14" y="14" rx="1" />
        <rect width="7" height="7" x="3" y="14" rx="1" />
      </svg>
      <span>Habits</span>
    </a>
    <a href="/progress.html" class="nav-item active" aria-current="page">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="6" />
        <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11" />
      </svg>
      <span>Progress</span>
    </a>
    <a href="/" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
        <line x1="16" x2="16" y1="2" y2="6" />
        <line x1="8" x2="8" y1="2" y2="6" />
        <line x1="3" x2="21" y1="10" y2="10" />
        <path d="m9 16 2 2 4-4" />
      </svg>
      <span>Today</span>
    </a>
    <a href="/analytics.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" x2="18" y1="20" y2="10" />
        <line x1="12" x2="12" y1="20" y2="4" />
        <line x1="6" x2="6" y1="20" y2="14" />
      </svg>
      <span>Insights</span>
    </a>
    <a href="/settings.html" class="nav-item">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
      <span>Settings</span>
    </a>
  </nav>

  <script src="js/onlineGuard.js?v=1788640000"></script>
  <script src="js/api.js?v=1788628000"></script>
  <script src="js/utils.js?v=1788628000"></script>

  <script src="js/progress.js?v=1788632000"></script>
</body>
